apiVersion: v1
kind: Pod
metadata:
  name: "" # ИЗМЕНИТЕ: сделайте имя пустым
  namespace: my-namespace
  labels:
    app: my-application
    environment: production
    tier: backend
spec:
  os: invalid_os # ИЗМЕНИТЕ: сделайте неправильное значение OS
  containers:
    - name: main_container
      image: registry.bigbrother.io/myapp:v1.0.0
      ports:
        - containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: -100 # ИЗМЕНИТЕ: сделайте отрицательный порт
      livenessProbe:
        httpGet:
          path: /alive
          port: 8080
      resources:
        limits:
          cpu: 2
          memory: "1Gi"
        requests:
          cpu: "1" # ИЗМЕНИТЕ: сделайте строку вместо числа
          memory: "512Mi"
