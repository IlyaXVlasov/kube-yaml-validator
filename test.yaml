apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  namespace: my-namespace
  labels:
    app: my-application
    environment: production
    tier: backend
spec:
  os:
    name: linux
  containers:
    - name: main_container
      image: registry.bigbrother.io/myapp:v1.0.0
      ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
      livenessProbe:
        httpGet:
          path: /alive
          port: 8080
      resources:
        limits:
          cpu: 2
          memory: "1Gi"
        requests:
          cpu: 1
          memory: "512Mi"
    - name: sidecar_container
      image: registry.bigbrother.io/sidecar:v2.1.0
      resources:
        limits:
          cpu: 1
          memory: "256Mi"
        requests:
          cpu: 500m
          memory: "128Mi"
